name: argus_console
services:
  argus_console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        FLAG: ${FLAG:?Set FLAG}
    networks:
      - back
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    ulimits:
      nproc: 256
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  argus_edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: edge
    environment:
      UPSTREAM: argus_console:8080
    ports:
      - '0.0.0.0:18112:8080'
    networks:
      - front
      - back
    depends_on:
      - argus_console
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25

networks:
  front: {}
  back:
    internal: true

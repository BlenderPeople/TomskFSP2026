<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Minesweeper Pro</title>
<style>
:root { --bg:#1a1a2e; --fg:#eaeaea; --cell:#252540; --open:#16213e; --num1:#64b5f6; --num2:#81c784; --num3:#e57373; --num4:#ffb74d; --num5:#ba68c8; --num6:#4db6ac; --num7:#fff176; --num8:#ef9a9a; --mine:#f44336; --flag:#ffd600; --border:#3a3a5c; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:1.6rem;margin-bottom:8px;letter-spacing:.5px}
.status{display:flex;gap:16px;margin-bottom:16px;font-size:.9rem;color:#aaa}
.status span{background:var(--cell);padding:4px 10px;border-radius:4px;border:1px solid var(--border)}
#board{display:grid;grid-template-columns:repeat(9,36px);gap:2px;background:var(--border);border:2px solid var(--border);border-radius:6px;margin-bottom:16px}
.cell{width:36px;height:36px;background:var(--cell);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:600;transition:background .08s}
.cell:hover{background:#2d2d50}
.cell.open{background:var(--open);cursor:default}
.cell.open[data-num="0"]{background:var(--open)}
.cell[data-num="1"]{color:var(--num1)}
.cell[data-num="2"]{color:var(--num2)}
.cell[data-num="3"]{color:var(--num3)}
.cell[data-num="4"]{color:var(--num4)}
.cell[data-num="5"]{color:var(--num5)}
.cell[data-num="6"]{color:var(--num6)}
.cell[data-num="7"]{color:var(--num7)}
.cell[data-num="8"]{color:var(--num8)}
.cell.mine{background:var(--mine);color:#fff}
.cell.flag{background:var(--cell);color:var(--flag)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
button{padding:10px 18px;border:none;border-radius:4px;background:#0f3460;color:var(--fg);font-weight:600;cursor:pointer;transition:background .15s}
button:hover{background:#1a4a8a}
button:disabled{background:#2a2a4a;color:#666;cursor:not-allowed}
#log{width:100%;max-width:360px;height:140px;background:#0d0d1a;border:1px solid var(--border);border-radius:4px;padding:8px;font-family:monospace;font-size:.75rem;color:#888;overflow-y:auto}
.log-entry{margin:2px 0}
.log-entry.error{color:#e57373}
.log-entry.ok{color:#81c784}
.log-entry.info{color:#64b5f6}
</style>
</head>
<body>
<h1>Minesweeper Pro</h1>
<div class="status">
<span id="sRound">Раунд: –</span>
<span id="sWins">Пройдено: 0/50</span>
<span id="sTime">⏱ 25.0 с</span>
<span id="sLeft">Осталось: –</span>
</div>
<div id="board"></div>
<div class="controls">
<button id="btnNew" onclick="newGame()">Новая игра</button>
</div>
<div id="log"></div>

<script>
const BOARD=9;
let timerId=null, boardEl=document.getElementById('board');
const CELL_NUM=['','1','2','3','4','5','6','7','8'];

function log(msg,cls='info'){
  const e=document.createElement('div');
  e.className='log-entry '+cls; e.textContent=new Date().toLocaleTimeString()+' '+msg;
  const L=document.getElementById('log'); L.prepend(e);
}

async function api(path, opts={}){
  const h={'Content-Type':'application/json'};
  const r=await fetch(path,{...opts,headers:h,credentials:'include'});
  const ct=r.headers.get('content-type')||'';
  if(ct.includes('application/json')) return [r.ok, await r.json()];
  const t=await r.text(); return [r.ok, t];
}

function render(state){
  document.getElementById('sRound').textContent='Раунд: '+state.round;
  document.getElementById('sWins').textContent='Пройдено: '+state.wins+'/50';
  document.getElementById('sTime').textContent='⏱ '+(state.time_left??0).toFixed(1)+' с';
  document.getElementById('sLeft').textContent='Осталось: '+(state.remaining??'–');
  const cells=state.cells;
  if(!cells) return;
  boardEl.innerHTML='';
  cells.forEach((row,y)=>{
    row.forEach((v,x)=>{
      const b=document.createElement('button');
      b.className='cell';
      b.dataset.x=x; b.dataset.y=y;
      if(v===-1){ b.textContent=''; }
      else if(v===9){ b.classList.add('mine'); b.textContent='💣'; }
      else{ b.classList.add('open'); b.dataset.num=v; b.textContent=v===0?'':CELL_NUM[v]; }
      b.onclick=()=>openCell(x,y);
      boardEl.appendChild(b);
    });
  });
}

async function syncScore(wins){
  const [ok, res]=await api('/api/score',{method:'POST',body:JSON.stringify({wins})});
  if(ok && res.flag_unlocked){
    const [fok, fdata]=await api('/api/flag');
    if(fok && fdata.flag){ log('🏁 Флаг: '+fdata.flag,'ok'); stopTimer(); }
  }
}

async function openCell(x,y){
  const [ok, data]=await api('/api/open',{method:'POST',body:JSON.stringify({x,y})});
  if(!ok){ log('Ошибка: '+JSON.stringify(data),'error'); return; }
  if(data.boom){ log('💥 Бум на ['+x+','+y+']!', 'error'); render(data); setTimeout(newGame,1200); return; }
  if(data.timeout){ log('⏰ Таймаут', 'error'); setTimeout(newGame,1200); return; }
  render(data);
  if(data.cleared){
    log('✅ Раунд '+(data.round-1)+' пройден','ok');
    await syncScore(data.wins);
  }
  if(data.flag){ log('🏁 Флаг: '+data.flag,'ok'); stopTimer(); }
}

async function newGame(){
  stopTimer();
  const [ok, data]=await api('/api/session',{method:'POST',body:JSON.stringify({variant:1})});
  if(!ok){ log('Не удалось начать игру','error'); return; }
  log('🎮 Новая игра начата','ok');
  render(data);
  startTimer(data.time_left||25);
}

function startTimer(sec){
  stopTimer();
  let t=sec;
  timerId=setInterval(async()=>{
    t=Math.max(0,t-0.1);
    document.getElementById('sTime').textContent='⏱ '+t.toFixed(1)+' с';
    if(t<=0.1){
      const [ok, data]=await api('/api/state');
      if(ok && data.time_left<=0 && !data.done){
        log('⏰ Время вышло','error');
        stopTimer();
        setTimeout(newGame,1200);
      }
    }
  },100);
}
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }

newGame();
</script>
</body>
</html>
